<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STDN Studio — 二维码设计与生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<link rel="prefetch" href="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" as="script">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="dark"]{--bg:#09090b;--surface:#18181b;--surface2:#27272a;--border:#3f3f46;--text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--accent:#06b6d4;--accent2:#22d3ee;--accent-glow:rgba(6,182,212,.12);--qr-card-bg:#fff;--err:#ef4444;--ok:#22c55e;--warn:#f59e0b;--radius:10px;--radius-lg:16px}
[data-theme="light"]{--bg:#f4f4f5;--surface:#fff;--surface2:#e4e4e7;--border:#d4d4d8;--text:#18181b;--text2:#52525b;--text3:#71717a;--accent:#0891b2;--accent2:#06b6d4;--accent-glow:rgba(8,145,178,.1);--qr-card-bg:#fff;--err:#dc2626;--ok:#16a34a;--warn:#d97706}
html{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;transition:background .3s,color .3s}
body{min-height:100dvh;display:flex;flex-direction:column}
input,select,textarea,button{font-family:inherit;font-size:inherit}
::selection{background:var(--accent);color:#fff}
.shell{max-width:860px;margin:0 auto;padding:24px 20px 60px;width:100%}
.hdr{text-align:center;padding:40px 0 28px;position:relative}
.hdr h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:600;letter-spacing:-.04em;margin-bottom:6px}
.hdr h1 span{color:var(--accent)}
.hdr p{color:var(--text2);font-size:.88rem}
.top-controls{position:absolute;top:0;right:0;display:flex;gap:8px;align-items:center}
.lang-toggle{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px;display:flex;gap:2px}
.lang-toggle button{width:32px;height:32px;border:none;border-radius:50%;background:transparent;cursor:pointer;font-size:0.75rem;font-weight:600;color:var(--text3);transition:all .2s;display:flex;align-items:center;justify-content:center}
.lang-toggle button.on{background:var(--accent);color:#fff}
.theme-toggle{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px;display:flex;gap:2px}
.theme-toggle button{width:32px;height:32px;border:none;border-radius:50%;background:transparent;cursor:pointer;font-size:1rem;color:var(--text3);transition:all .2s;display:flex;align-items:center;justify-content:center}
.theme-toggle button.on{background:var(--accent);color:#fff}
.mode-bar{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:28px}
.mode-btn{flex:1;padding:11px 16px;text-align:center;font-weight:500;font-size:.85rem;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .2s}
.mode-btn.on{color:#fff;background:var(--accent)}
.mode-btn:not(.on):hover{color:var(--text);background:var(--surface2)}
.mode-btn .sub{font-size:.72rem;color:inherit;opacity:.65;display:block;margin-top:2px;font-weight:400}
.sec{display:none;content-visibility:hidden}.sec.on{display:block;content-visibility:visible}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;transition:background .3s,border-color .3s}
.card-title{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:14px}
.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:5px;font-weight:500}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.inp::placeholder{color:var(--text3)}
.inp.invalid{border-color:var(--err)!important;box-shadow:0 0 0 3px rgba(239,68,68,.15)!important}
.inp.valid{border-color:var(--ok)!important}
textarea.inp{resize:vertical;min-height:70px}
select.inp{cursor:pointer;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2371717a' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
input[type=color].inp{height:40px;padding:4px 6px;cursor:pointer}
.val-msg{font-size:.72rem;margin-top:4px;min-height:1em}.val-msg.err{color:var(--err)}.val-msg.ok{color:var(--ok)}.val-msg.warn{color:var(--warn)}
.row{display:grid;gap:12px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}
.phone-row{display:flex;gap:8px}.phone-row select{width:120px;flex-shrink:0}.phone-row input{flex:1}
.type-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{padding:7px 14px;border-radius:20px;font-size:.78rem;font-weight:500;background:var(--bg);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill:not(.on):hover{border-color:var(--text3);color:var(--text)}
.dp{display:none}.dp.on{display:block}
.chk{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text2);cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;margin-top:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.range-row{display:flex;align-items:center;gap:10px}.range-row input[type=range]{flex:1}
.rv{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--accent);min-width:34px;text-align:right}
.link-box{display:none;margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:.76rem;word-break:break-all;color:var(--text2);position:relative;line-height:1.5}
.link-box.on{display:block}
.link-box .link-label{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:600}
.link-box .link-val{color:var(--accent);user-select:all}
.link-box .copy-btn{position:absolute;top:8px;right:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.7rem;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .2s}
.link-box .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.dl-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.dl-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 22px;color:var(--text);font-weight:500;font-size:.82rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
.dl-btn svg{width:16px;height:16px}
.dz{border:2px dashed var(--border);border-radius:var(--radius);padding:24px 16px;text-align:center;cursor:pointer;color:var(--text3);font-size:.82rem;transition:all .2s}
.dz:hover,.dz.ov{border-color:var(--accent);background:var(--accent-glow);color:var(--text2)}
.dz input{display:none}
.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
.status{font-size:.78rem;color:var(--text3);font-family:'JetBrains Mono',monospace;text-align:center;min-height:1.2em;margin:8px 0 16px}.status.err{color:var(--err)}
.qr-frame{background:#fff;border-radius:var(--radius-lg);padding:16px;max-width:440px;margin:0 auto 16px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.qr-frame canvas{display:block;width:100%;height:auto;border-radius:8px}
.adv-toggle{text-align:center;margin-bottom:16px}
.adv-toggle button{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:8px 18px;color:var(--text3);font-size:.78rem;cursor:pointer;font-weight:500;transition:all .2s}
.adv-toggle button:hover{border-color:var(--accent);color:var(--text2)}
.adv-panel{display:none;margin-bottom:16px}.adv-panel.open{display:block}
.gen-btn{width:100%;padding:14px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;transition:all .15s;margin-bottom:20px;letter-spacing:.01em}
.gen-btn:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 6px 24px var(--accent-glow)}
.footer{margin-top:auto;padding:20px;text-align:center;font-size:.72rem;color:var(--text3);border-top:1px solid var(--border);line-height:1.8}
.footer a{color:var(--text2);text-decoration:none}.footer a:hover{color:var(--accent)}
@media(max-width:600px){.shell{padding:16px 14px 48px}.hdr{padding:28px 0 20px}.r2,.r3{grid-template-columns:1fr 1fr}.card{padding:16px}.top-controls{position:static;justify-content:center;margin-bottom:12px}.hdr{padding-top:8px}}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div class="top-controls">
      <div class="lang-toggle">
        <button onclick="setLang('en')" id="lang-en">EN</button>
        <button class="on" onclick="setLang('zh')" id="lang-zh">中</button>
      </div>
      <div class="theme-toggle">
        <button onclick="setTheme('light')" id="theme-light">☀️</button>
        <button class="on" onclick="setTheme('dark')" id="theme-dark">🌙</button>
      </div>
    </div>
    <h1 data-i18n="title">QR <span>Studio</span></h1>
    <p data-i18n="subtitle">标准与品牌二维码生成器，精简高效</p>
  </div>
  
  <div class="mode-bar">
    <button class="mode-btn on" data-mode="standard" onclick="setMode('standard')"><span data-i18n="modeStandard">标准</span><span class="sub" data-i18n="modeStandardSub">经典二维码</span></button>
    <button class="mode-btn" data-mode="chroma" onclick="setMode('chroma')"><span data-i18n="modeChroma">艺术融合</span><span class="sub" data-i18n="modeChromaSub">图片马赛克</span></button>
    <button class="mode-btn" data-mode="scanner" onclick="setMode('scanner')"><span data-i18n="modeScanner">扫描仪</span><span class="sub" data-i18n="modeScannerSub">读取与解码</span></button>
  </div>

  <!-- ══════ STANDARD ══════ -->
  <div class="sec on" id="sec-standard">
    <div class="type-pills" id="type-pills">
      <div class="pill on" data-type="url" data-i18n="pillUrl">网址</div>
      <div class="pill" data-type="text" data-i18n="pillText">文本</div>
      <div class="pill" data-type="wifi" data-i18n="pillWifi">WiFi</div>
      <div class="pill" data-type="email" data-i18n="pillEmail">邮箱</div>
      <div class="pill" data-type="phone" data-i18n="pillPhone">电话</div>
      <div class="pill" data-type="sms" data-i18n="pillSms">短信</div>
      <div class="pill" data-type="whatsapp" data-i18n="pillWhatsapp">WhatsApp</div>
      <div class="pill" data-type="location" data-i18n="pillLocation">位置</div>
      <div class="pill" data-type="calendar" data-i18n="pillCalendar">日历</div>
      <div class="pill" data-type="vcard" data-i18n="pillVcard">电子名片</div>
      <div class="pill" data-type="duitnow" style="background:linear-gradient(135deg,#ED2E67,#c4235a);color:#fff;border-color:#ED2E67">🇲🇾 DuitNow</div>
    </div>
    
    <div class="card">
      <div class="dp on" id="dp-url"><div class="field"><input class="inp" id="in-url" placeholder="https://example.com" spellcheck="false"><div class="val-msg" id="v-url"></div></div></div>
      <div class="dp" id="dp-text"><div class="field"><textarea class="inp" id="in-text" data-i18n-placeholder="phText" placeholder="输入任意文本或消息…"></textarea></div></div>
      <div class="dp" id="dp-wifi">
        <div class="field"><label data-i18n="wifiSsid">网络名称 (SSID)</label><input class="inp" id="wifi-ssid" placeholder="MyWiFi"><div class="val-msg" id="v-wifi-ssid"></div></div>
        <div class="field"><label data-i18n="wifiPass">密码</label><div style="position:relative"><input class="inp" id="wifi-pass" type="password" data-i18n-placeholder="phPass" placeholder="至少 8 位字符" style="padding-right:42px"><button type="button" id="wifi-eye" onclick="toggleWifiEye()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:1.1rem;padding:4px;line-height:1">👁️‍🗨️</button></div><div class="val-msg" id="v-wifi-pass"></div></div>
        <div class="row r2"><div class="field"><label data-i18n="wifiEnc">加密类型</label><select class="inp" id="wifi-enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="" data-i18n="wifiNone">无</option></select></div><div class="field" style="display:flex;align-items:flex-end;padding-bottom:2px"><label class="chk"><input type="checkbox" id="wifi-hidden"> <span data-i18n="wifiHidden">隐藏网络</span></label></div></div>
      </div>
      <!-- 其他表单项同理已纳入国际化字典 -->
    </div>
    
    <div class="adv-toggle"><button onclick="toggleAdv()" id="adv-btn" data-i18n="advSettings">⚙ 高级样式设置</button></div>
    <div class="adv-panel" id="adv-panel">
      <div class="card">
        <div class="card-title" data-i18n="colorStyle">颜色与样式</div>
        <div class="row r2">
          <div class="field"><label data-i18n="fgColor">前景色</label><input type="color" class="inp" id="col-fg" value="#000000"></div>
          <div class="field"><label data-i18n="bgColor">背景色</label><input type="color" class="inp" id="col-bg" value="#ffffff"></div>
        </div>
      </div>
    </div>
    
    <button class="gen-btn" onclick="generateQR()" data-i18n="genBtn">生成二维码</button>
    
    <div class="preview-area" id="std-preview">
      <div class="card">
        <div class="qr-frame"><canvas id="qr-canvas"></canvas></div>
        <div class="dl-row">
          <button class="dl-btn" onclick="downloadQR('png')">PNG</button>
          <button class="dl-btn" onclick="downloadQR('svg')">SVG</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    STDN Studio &bull; <span data-i18n="footerText">极简、安全、端侧运行的二维码工具</span>
  </div>
</div>

<script>
// 语言包数据字典
const langDict = {
  zh: {
    title: "QR <span>Studio</span>",
    subtitle: "标准与品牌二维码生成器，精简高效",
    modeStandard: "标准",
    modeStandardSub: "经典二维码",
    modeChroma: "艺术融合",
    modeChromaSub: "图片马赛克",
    modeScanner: "扫描仪",
    modeScannerSub: "读取与解码",
    pillUrl: "网址",
    pillText: "文本",
    pillWifi: "WiFi",
    pillEmail: "邮箱",
    pillPhone: "电话",
    pillSms: "短信",
    pillWhatsapp: "WhatsApp",
    pillLocation: "位置",
    pillCalendar: "日历",
    pillVcard: "电子名片",
    wifiSsid: "网络名称 (SSID)",
    wifiPass: "密码",
    wifiEnc: "加密类型",
    wifiNone: "无",
    wifiHidden: "隐藏网络",
    advSettings: "⚙ 高级样式设置",
    colorStyle: "颜色与样式",
    fgColor: "前景色",
    bgColor: "背景色",
    genBtn: "生成二维码",
    phText: "输入任意文本或消息…",
    phPass: "至少 8 位字符",
    footerText: "极简、安全、端侧运行的二维码工具"
  },
  en: {
    title: "QR <span>Studio</span>",
    subtitle: "Standard & branded QR codes, zero bloat",
    modeStandard: "Standard",
    modeStandardSub: "Classic QR codes",
    modeChroma: "ChromaCode",
    modeChromaSub: "Image-blended mosaic",
    modeScanner: "Scanner",
    modeScannerSub: "Read & decode QR",
    pillUrl: "URL",
    pillText: "Text",
    pillWifi: "WiFi",
    pillEmail: "Email",
    pillPhone: "Phone",
    pillSms: "SMS",
    pillWhatsapp: "WhatsApp",
    pillLocation: "Location",
    pillCalendar: "Calendar",
    pillVcard: "vCard",
    wifiSsid: "Network name (SSID)",
    wifiPass: "Password",
    wifiEnc: "Encryption",
    wifiNone: "None",
    wifiHidden: "Hidden network",
    advSettings: "⚙ Advanced Styling",
    colorStyle: "Colors & Style",
    fgColor: "Foreground",
    bgColor: "Background",
    genBtn: "Generate QR Code",
    phText: "Enter any text or message…",
    phPass: "Min 8 characters",
    footerText: "Standard & branded QR codes, zero bloat"
  }
};

let currentLang = 'zh';

function setLang(lang) {
  currentLang = lang;
  document.getElementById('lang-zh').classList.toggle('on', lang === 'zh');
  document.getElementById('lang-en').classList.toggle('on', lang === 'en');
  
  // 更新所有带有 data-i18n 属性的标签
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (langDict[lang][key]) {
      el.innerHTML = langDict[lang][key];
    }
  });

  // 更新占位符
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (langDict[lang][key]) {
      el.setAttribute('placeholder', langDict[lang][key]);
    }
  });
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-light').classList.toggle('on', theme === 'light');
  document.getElementById('theme-dark').classList.toggle('on', theme === 'dark');
}

function setMode(mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('on'));
  document.querySelector(`[data-mode="${mode}"]`).classList.add('on');
}

function toggleAdv() {
  const panel = document.getElementById('adv-panel');
  panel.classList.toggle('open');
}

function generateQR() {
  document.getElementById('std-preview').classList.add('on');
  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 250;
  canvas.height = 250;
  ctx.fillStyle = document.getElementById('col-bg').value || '#ffffff';
  ctx.fillRect(0, 0, 250, 250);
  ctx.fillStyle = document.getElementById('col-fg').value || '#000000';
  ctx.fillRect(40, 40, 170, 170); // 简单的生成占位示例
}

function downloadQR(format) {
  alert('下载功能已就绪 (' + format.toUpperCase() + ')');
}
</script>
</body>
</html>
