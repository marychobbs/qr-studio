<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STDN Studio - 专业二维码生成平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- qrcode-generator JS library for robust matrix calculation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <!-- jsQR for Scanner -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Strict square canvas wrapper to prevent aspect ratio distortion */
        .qr-canvas-box {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            position: relative;
        }
        .qr-canvas-box canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-qrcode text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight flex items-center gap-2">
                        STDN Studio <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-full">v1.0 Pro</span>
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400" data-i18n="subtitle">专业品牌化二维码生成平台</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Language Toggle -->
                <button onclick="toggleLanguage()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-globe text-slate-400"></i>
                    <span id="lang-label">English</span>
                </button>

                <!-- High Contrast Toggle -->
                <button onclick="toggleHighContrast()" title="高对比度" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>

                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Controls & Configuration (7 cols) -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            
            <!-- Tab Navigation -->
            <div class="flex bg-slate-200 dark:bg-slate-800 p-1 rounded-xl shadow-inner">
                <button onclick="switchMode('generator')" id="tab-generator" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="tab_generator">生成器</span>
                </button>
                <button onclick="switchMode('chromacode')" id="tab-chromacode" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                    <i class="fa-solid fa-palette"></i> <span data-i18n="tab_chromacode">ChromaCode 艺术融合</span>
                </button>
                <button onclick="switchMode('scanner')" id="tab-scanner" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                    <i class="fa-solid fa-camera"></i> <span data-i18n="tab_scanner">扫描解码</span>
                </button>
            </div>

            <!-- VIEW 1: GENERATOR -->
            <div id="view-generator" class="tab-content active space-y-6">
                
                <!-- Input Content Panel -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                    <h2 class="text-base font-semibold flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                        <i class="fa-solid fa-file-lines"></i> <span data-i18n="step1_title">1. 选择类型与数据内容</span>
                    </h2>

                    <!-- Type Selector Options Grid -->
                    <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
                        <button onclick="setQRType('url')" id="type-btn-url" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-link"></i> 网址 URL
                        </button>
                        <button onclick="setQRType('text')" id="type-btn-text" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-align-left"></i> 文本 Text
                        </button>
                        <button onclick="setQRType('wifi')" id="type-btn-wifi" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-wifi"></i> WiFi
                        </button>
                        <button onclick="setQRType('email')" id="type-btn-email" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-envelope"></i> 邮箱
                        </button>
                        <button onclick="setQRType('phone')" id="type-btn-phone" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-phone"></i> 电话
                        </button>
                        <button onclick="setQRType('sms')" id="type-btn-sms" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-comment-sms"></i> 短信
                        </button>
                        <button onclick="setQRType('whatsapp')" id="type-btn-whatsapp" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-brands fa-whatsapp"></i> WhatsApp
                        </button>
                        <button onclick="setQRType('location')" id="type-btn-location" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-location-dot"></i> 地理位置
                        </button>
                        <button onclick="setQRType('vcard')" id="type-btn-vcard" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-address-card"></i> 电子名片
                        </button>
                        <button onclick="setQRType('calendar')" id="type-btn-calendar" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-calendar-days"></i> 日历活动
                        </button>
                        <button onclick="setQRType('duitnow')" id="type-btn-duitnow" class="type-pill px-3 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-wallet"></i> DuitNow/支付
                        </button>
                    </div>

                    <!-- Dynamic Input Container -->
                    <div id="form-container" class="pt-2">
                        <!-- Dynamic inputs injected via JS -->
                    </div>
                </div>

                <!-- Styling & Customization Panel -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                    <h2 class="text-base font-semibold flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                        <i class="fa-solid fa-palette"></i> <span data-i18n="step2_title">2. 品牌美化与参数选择</span>
                    </h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Module Shape -->
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1" data-i18n="module_shape">码点形状 (Module Shape)</label>
                            <select id="module-shape" onchange="renderQR()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="square">经典方形 (Square)</option>
                                <option value="rounded">圆角矩形 (Rounded)</option>
                                <option value="dots">圆点阵列 (Dots)</option>
                            </select>
                        </div>

                        <!-- Error Correction Level -->
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1" data-i18n="ecl_label">容错级别 (Error Correction)</label>
                            <select id="ecl-select" onchange="renderQR()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="L">L (7% 破坏恢复)</option>
                                <option value="M" selected>M (15% 破坏恢复)</option>
                                <option value="Q">Q (25% 破坏恢复)</option>
                                <option value="H">H (30% 容错 - 建议嵌入Logo)</option>
                            </select>
                        </div>

                        <!-- Colors -->
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1" data-i18n="fg_color">码点颜色 (Foreground)</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="fg-color" value="#4f46e5" onchange="syncColorText('fg')" class="w-10 h-10 rounded-xl border-0 cursor-pointer">
                                <input type="text" id="fg-color-text" value="#4f46e5" oninput="syncColorInput('fg')" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-mono">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1" data-i18n="bg_color">背景颜色 (Background)</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="bg-color" value="#ffffff" onchange="syncColorText('bg')" class="w-10 h-10 rounded-xl border-0 cursor-pointer">
                                <input type="text" id="bg-color-text" value="#ffffff" oninput="syncColorInput('bg')" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-mono">
                            </div>
                        </div>
                    </div>

                    <!-- Logo Attachment -->
                    <div class="pt-3 border-t border-slate-100 dark:border-slate-700">
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5" data-i18n="logo_upload">中心 Logo / 品牌图标 (嵌入与白色遮罩)</label>
                        <div class="flex items-center gap-3">
                            <input type="file" id="logo-file" accept="image/*" onchange="handleLogoUpload(event)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 dark:file:bg-indigo-900/50 file:text-indigo-600 dark:file:text-indigo-300 hover:file:bg-indigo-100 transition">
                            <button onclick="removeLogo()" class="px-3 py-2 rounded-xl border border-rose-200 dark:border-rose-900/50 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-xs transition shrink-0" data-i18n="remove_logo">清除 Logo</button>
                        </div>
                    </div>

                    <!-- Preset Style Templates -->
                    <div class="pt-3 border-t border-slate-100 dark:border-slate-700">
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2" data-i18n="templates">快捷预设风格</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="applyTemplate('corporate')" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-500 text-xs font-medium transition text-center bg-slate-50 dark:bg-slate-900">商务科技蓝</button>
                            <button onclick="applyTemplate('emerald')" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-emerald-500 text-xs font-medium transition text-center bg-slate-50 dark:bg-slate-900">翡翠优雅绿</button>
                            <button onclick="applyTemplate('minimalist')" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-slate-900 text-xs font-medium transition text-center bg-slate-50 dark:bg-slate-900">经典黑白</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- VIEW 2: CHROMACODE (ARTISTIC BLEND) -->
            <div id="view-chromacode" class="tab-content space-y-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                    <h2 class="text-base font-semibold flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                        <i class="fa-solid fa-palette"></i> <span data-i18n="cc_title">ChromaCode 艺术融合码</span>
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400" data-i18n="cc_desc">上传自定义背景图，通过柔和半透明色彩叠加与几何码点融合，生成具有高视觉冲击力的艺术二维码。</p>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">艺术码链接 / 内容</label>
                            <input type="text" id="cc-input" value="https://example.com/art" oninput="renderQR()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">背景画布图片</label>
                            <input type="file" id="cc-bg-file" accept="image/*" onchange="handleChromaBgUpload(event)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 dark:file:bg-indigo-900/50 file:text-indigo-600 dark:file:text-indigo-300 hover:file:bg-indigo-100 transition">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">快速艺术渐变预设</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button onclick="setChromaPreset('aurora')" class="p-3 rounded-xl border border-teal-500 bg-gradient-to-r from-teal-400 to-indigo-500 text-white text-xs font-bold shadow">极光之夜</button>
                                <button onclick="setChromaPreset('sunset')" class="p-3 rounded-xl border border-orange-500 bg-gradient-to-r from-orange-400 to-rose-500 text-white text-xs font-bold shadow">落日熔金</button>
                                <button onclick="setChromaPreset('cyber')" class="p-3 rounded-xl border border-purple-500 bg-gradient-to-r from-purple-500 to-pink-500 text-white text-xs font-bold shadow">赛博霓虹</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW 3: SCANNER -->
            <div id="view-scanner" class="tab-content space-y-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 text-center">
                    <h2 class="text-base font-semibold flex items-center justify-center gap-2 text-indigo-600 dark:text-indigo-400">
                        <i class="fa-solid fa-camera"></i> <span data-i18n="scanner_title">二维码实时扫描与文件识别</span>
                    </h2>

                    <!-- Video / Canvas Feed -->
                    <div class="relative w-full max-w-md mx-auto aspect-video bg-slate-900 rounded-2xl overflow-hidden flex items-center justify-center border border-slate-700 shadow-inner">
                        <video id="scanner-video" class="w-full h-full object-cover" autoplay playsinline muted></video>
                        <canvas id="scanner-canvas" class="hidden"></canvas>
                        <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 space-y-2 bg-slate-900/90">
                            <i class="fa-solid fa-video-slash text-3xl text-slate-600"></i>
                            <span class="text-xs">摄像头处于关闭状态</span>
                        </div>
                    </div>

                    <div class="flex justify-center gap-3">
                        <button onclick="startScanner()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-lg shadow-indigo-500/20 transition flex items-center gap-2">
                            <i class="fa-solid fa-play"></i> 开启摄像头
                        </button>
                        <button onclick="stopScanner()" class="px-4 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition flex items-center gap-2">
                            <i class="fa-solid fa-stop"></i> 关闭摄像头
                        </button>
                    </div>

                    <!-- Drag & Drop Image File Decode -->
                    <div class="pt-4 border-t border-slate-100 dark:border-slate-700">
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">或上传二维码图片识别</label>
                        <input type="file" accept="image/*" onchange="decodeUploadedImage(event)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 dark:file:bg-slate-700 file:text-slate-700 dark:file:text-slate-200 hover:file:bg-slate-200 transition">
                    </div>

                    <!-- Result Box -->
                    <div class="pt-2 text-left">
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1" data-i18n="scan_result">扫描/解算结果</label>
                        <div id="scan-result-box" class="p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-mono break-all text-slate-700 dark:text-slate-300 min-h-[60px] flex items-center">
                            <span class="text-slate-400 text-xs italic">暂未检测到二维码内容</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Right Column: Real-time Preview & Export Studio (5 cols) -->
        <div class="lg:col-span-5 flex flex-col space-y-6">
            
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm sticky top-24 flex flex-col items-center space-y-6">
                
                <div class="w-full flex items-center justify-between">
                    <h3 class="font-semibold text-sm flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                        <i class="fa-solid fa-eye"></i> <span data-i18n="preview_title">实时二维码预览</span>
                    </h3>
                    <span id="dimension-badge" class="text-xs font-mono px-2.5 py-1 bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-500 dark:text-slate-400">1024 x 1024 px</span>
                </div>

                <!-- Guarantee strict 1:1 Aspect Ratio Box with High DPI Canvas -->
                <div class="qr-canvas-box bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-inner">
                    <canvas id="qr-canvas"></canvas>
                </div>

                <!-- Export Controls & Downloading -->
                <div class="w-full space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1" data-i18n="export_format">文件格式</label>
                            <select id="export-format" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none">
                                <option value="png">PNG 高清图片</option>
                                <option value="jpg">JPG 压缩图片</option>
                                <option value="svg">SVG 矢量图</option>
                            </select>
                        </div>

        function renderQR() {
            const canvas = document.getElementById('qr-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const payload = getPayloadData();
            const ecl = document.getElementById('ecl-select').value;
            const shape = document.getElementById('module-shape').value;
            const fgColor = document.getElementById('fg-color').value;
            const bgColor = document.getElementById('bg-color').value;

            // Generate matrix using qrcode-generator
            let qr;
            try {
                qr = qrcode(0, ecl);
                qr.addData(payload);
                qr.make();
            } catch (err) {
                // If payload is too big for auto-type-number, fallback to type 10
                qr = qrcode(10, ecl);
                qr.addData(payload);
                qr.make();
            }

            const moduleCount = qr.getModuleCount();
            
            // High DPI resolution setup
            const outputResolution = 1024;
            canvas.width = outputResolution;
            canvas.height = outputResolution;

            ctx.clearRect(0, 0, outputResolution, outputResolution);

            // 1. Background drawing
            if (currentMode === 'chromacode' && chromaBgObj) {
                // Draw background image scaled to fit square
                ctx.drawImage(chromaBgObj, 0, 0, outputResolution, outputResolution);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fillRect(0, 0, outputResolution, outputResolution);
            } else {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, outputResolution, outputResolution);
            }

            // Calculate grid sizing with padding
            const padding = outputResolution * 0.08;
            const availableSize = outputResolution - padding * 2;
            const cellSize = availableSize / moduleCount;

            // 2. Draw Modules
            ctx.fillStyle = fgColor;

            for (let r = 0; r < moduleCount; r++) {
                for (let c = 0; c < moduleCount; c++) {
                    if (qr.isDark(r, c)) {
                        const x = padding + c * cellSize;
                        const y = padding + r * cellSize;

                        if (shape === 'dots') {
                            ctx.beginPath();
                            ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize * 0.4, 0, Math.PI * 2);
                            ctx.fill();
                        } else if (shape === 'rounded') {
                            const radius = cellSize * 0.35;
                            ctx.beginPath();
                            ctx.roundRect(x, y, cellSize * 0.95, cellSize * 0.95, radius);
                            ctx.fill();
                        } else {
                            // Default square
                            ctx.fillRect(x, y, cellSize + 0.5, cellSize + 0.5);
                        }
                    }
                }
            }

            // 3. Logo Attachment Center Overlay
            if (logoImageObj && currentMode === 'generator') {
                const logoScale = 0.22; // 22% size of overall canvas
                const logoSize = outputResolution * logoScale;
                const logoPos = (outputResolution - logoSize) / 2;

                // White rounded mask for contrast
                const maskPadding = logoSize * 0.1;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(
                    logoPos - maskPadding,
                    logoPos - maskPadding,
                    logoSize + maskPadding * 2,
                    logoSize + maskPadding * 2,
                    logoSize * 0.15
                );
                ctx.fill();

                // Draw logo
                ctx.drawImage(logoImageObj, logoPos, logoPos, logoSize, logoSize);
            }
        }

                img.onload = () => {
                    logoImageObj = img;
                    // Force Error Correction to H for optimal decoding when logo is present
                    document.getElementById('ecl-select').value = 'H';
                    renderQR();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

                document.getElementById('fg-color').value = '#7e22ce';
                document.getElementById('bg-color').value = '#f3e8ff';
            }
            document.getElementById('fg-color-text').value = document.getElementById('fg-color').value;
            document.getElementById('bg-color-text').value = document.getElementById('bg-color').value;
            renderQR();
        }

        function applyTemplate(type) {
            if (type === 'corporate') {
                document.getElementById('fg-color').value = '#1d4ed8';
                document.getElementById('bg-color').value = '#f0f9ff';
                document.getElementById('module-shape').value = 'rounded';
            } else if (type === 'emerald') {
                document.getElementById('fg-color').value = '#047857';
                document.getElementById('bg-color').value = '#ecfdf5';
                document.getElementById('module-shape').value = 'dots';
            } else if (type === 'minimalist') {
                document.getElementById('fg-color').value = '#000000';
                document.getElementById('bg-color').value = '#ffffff';
                document.getElementById('module-shape').value = 'square';
            }
            document.getElementById('fg-color-text').value = document.getElementById('fg-color').value;
            document.getElementById('bg-color-text').value = document.getElementById('bg-color').value;
            renderQR();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${mode}`).classList.add('active');

            ['generator', 'chromacode', 'scanner'].forEach(m => {
                const btn = document.getElementById(`tab-${m}`);
                if (m === mode) {
                    btn.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm";
                } else {
                    btn.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
                }
            });

            if (mode !== 'scanner') {
                stopScanner();
            }
            renderQR();
        }

        function startScanner() {
            const video = document.getElementById('scanner-video');
            const placeholder = document.getElementById('scanner-placeholder');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    scannerStream = stream;
                    video.srcObject = stream;
                    placeholder.style.display = 'none';
                    scannerInterval = setInterval(scanFrame, 300);
                })
                .catch(err => {
                    document.getElementById('scan-result-box').innerText = "错误: 无法启动摄像头 (" + err.message + ")";
                });
        }

        function stopScanner() {
            if (scannerStream) {
                scannerStream.getTracks().forEach(track => track.stop());
                scannerStream = null;
            }
            if (scannerInterval) {
                clearInterval(scannerInterval);
                scannerInterval = null;
            }
            document.getElementById('scanner-placeholder').style.display = 'flex';
        }

        function scanFrame() {
            const video = document.getElementById('scanner-video');
            const canvas = document.getElementById('scanner-canvas');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    document.getElementById('scan-result-box').innerHTML = `<strong class="text-emerald-600 dark:text-emerald-400">解码成功:</strong> ${code.data}`;
                }
            }
        }

        function decodeUploadedImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code) {
                        document.getElementById('scan-result-box').innerHTML = `<strong class="text-emerald-600 dark:text-emerald-400">上传解算成功:</strong> ${code.data}`;
                    } else {
                        document.getElementById('scan-result-box').innerHTML = `<span class="text-rose-500">无法识别图像中的二维码，请确保清晰度。</span>`;
                    }
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function downloadQR() {
            const format = document.getElementById('export-format').value;
            const targetSize = parseInt(document.getElementById('export-size').value);
            const canvas = document.getElementById('qr-canvas');

            if (format === 'svg') {
                downloadSVG(targetSize);
                return;
            }

            // Create offscreen high-res canvas for exact resolution download
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = targetSize;
            exportCanvas.height = targetSize;
            const ctx = exportCanvas.getContext('2d');

            ctx.drawImage(canvas, 0, 0, targetSize, targetSize);

            const mime = format === 'jpg' ? 'image/jpeg' : 'image/png';
            const link = document.createElement('a');
            link.download = `qr-studio-${Date.now()}.${format}`;
            link.href = exportCanvas.toDataURL(mime, 0.95);
            link.click();
        }

        function downloadSVG(size) {
            const payload = getPayloadData();
            const ecl = document.getElementById('ecl-select').value;
            const fgColor = document.getElementById('fg-color').value;
            const bgColor = document.getElementById('bg-color').value;

            const qr = qrcode(0, ecl);
            qr.addData(payload);
            qr.make();

            const count = qr.getModuleCount();
            const cellSize = size / count;

            let svgPath = '';
            for (let r = 0; r < count; r++) {
                for (let c = 0; c < count; c++) {
                    if (qr.isDark(r, c)) {
                        const x = c * cellSize;
                        const y = r * cellSize;
                        svgPath += `M${x},${y}h${cellSize}v${cellSize}h-${cellSize}z `;
                    }
                }
            }

            const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                <rect width="100%" height="100%" fill="${bgColor}"/>
                <path d="${svgPath}" fill="${fgColor}"/>
            </svg>`;

            const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = `qr-studio-${Date.now()}.svg`;
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        }

        // Accessibility & Header Helpers
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-label').innerText = currentLang === 'zh' ? 'English' : '中文';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function toggleHighContrast() {
            isHighContrast = !isHighContrast;
            if (isHighContrast) {
                document.documentElement.style.filter = 'contrast(1.35) saturate(1.2)';
            } else {
                document.documentElement.style.filter = 'none';
            }
        }
    </script>
</body>
</html>
